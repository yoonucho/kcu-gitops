apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: 817139100263.dkr.ecr.ap-southeast-2.amazonaws.com/webapp:32f2d7d263405dd45c5b8b75093edbab0f10b8bb
          ports:
            - containerPort: 80
