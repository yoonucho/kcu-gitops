apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: 817139100263.dkr.ecr.ap-southeast-2.amazonaws.com/webapp:ba0b1672119fcb779900a8629d53928a70462d6d
          ports:
            - containerPort: 80
